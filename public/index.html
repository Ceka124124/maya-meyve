<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍎 Meyve Memory — Çok Oyunculu</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --bg: #0a0a1a;
    --card-back: linear-gradient(135deg, #1a1a3e 0%, #2d1b69 50%, #1a1a3e 100%);
    --card-front: linear-gradient(135deg, #ffffff 0%, #f0f0ff 100%);
    --accent: #a78bfa;
    --gold: #fbbf24;
    --green: #34d399;
    --red: #f87171;
    --glow: rgba(167,139,250,0.4);
    --chat-w: 300px;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    width:100%; height:100%;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
    color: #fff;
    /* Prevent pull-to-refresh on mobile */
    overscroll-behavior: none;
  }

  /* ── PARTICLES ── */
  #particles {
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .particle {
    position:absolute; width:4px; height:4px; border-radius:50%;
    background: var(--accent); opacity:0; animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform:translateY(100vh) scale(0); opacity:0; }
    10%  { opacity:0.8; }
    90%  { opacity:0.3; }
    100% { transform:translateY(-10vh) scale(1.5); opacity:0; }
  }

  .screen { position:relative; z-index:1; min-height:100vh; }

  /* ── LOBBY ── */
  #lobbyScreen {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:1.5rem; min-height:100vh;
  }
  .game-title {
    font-size:clamp(2rem,8vw,5rem); font-weight:900;
    background: linear-gradient(135deg, #fbbf24, #a78bfa, #34d399, #f87171);
    background-size:300% 300%;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    animation: gradientShift 4s ease infinite;
    text-align:center;
    filter:drop-shadow(0 0 30px rgba(167,139,250,0.5));
    margin-bottom:0.3rem;
  }
  @keyframes gradientShift {
    0%,100%{ background-position:0% 50%; }
    50%    { background-position:100% 50%; }
  }
  .game-subtitle {
    font-size:1rem; color:#a78bfa; text-align:center; margin-bottom:2rem;
    letter-spacing:0.2em; text-transform:uppercase; opacity:0.8;
  }
  .lobby-card {
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(167,139,250,0.3);
    border-radius:24px; padding:2rem;
    width:min(480px,95vw);
    box-shadow:0 0 60px rgba(167,139,250,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
  }
  .input-group { margin-bottom:1.2rem; }
  .input-group label {
    display:block; font-size:0.82rem; color:#a78bfa;
    text-transform:uppercase; letter-spacing:0.15em; margin-bottom:0.5rem;
  }
  .input-group input {
    width:100%; padding:0.85rem 1.1rem;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(167,139,250,0.3);
    border-radius:12px; color:#fff; font-size:1.05rem;
    outline:none; transition:all 0.3s;
    /* Mobile: prevent zoom on focus */
    font-size:16px;
  }
  .input-group input:focus {
    border-color:#a78bfa;
    box-shadow:0 0 20px rgba(167,139,250,0.3);
    background:rgba(255,255,255,0.1);
  }
  .btn {
    width:100%; padding:0.95rem; border:none; border-radius:14px;
    font-size:1.05rem; font-weight:700; cursor:pointer;
    transition:all 0.25s; position:relative; overflow:hidden;
    text-transform:uppercase; letter-spacing:0.08em;
    /* mobile friendly touch */
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  .btn::after {
    content:''; position:absolute; inset:0;
    background:rgba(255,255,255,0.1); opacity:0; transition:opacity 0.2s;
  }
  .btn:hover::after { opacity:1; }
  .btn:active { transform:scale(0.97); }
  .btn-primary {
    background:linear-gradient(135deg,#7c3aed,#a78bfa); color:#fff;
    box-shadow:0 4px 25px rgba(124,58,237,0.5);
  }
  .btn-primary:hover { box-shadow:0 6px 35px rgba(124,58,237,0.7); transform:translateY(-2px); }
  .btn-start {
    background:linear-gradient(135deg,#059669,#34d399); color:#fff;
    box-shadow:0 4px 25px rgba(5,150,105,0.5); margin-top:1rem;
  }
  .btn-start:hover { box-shadow:0 6px 35px rgba(5,150,105,0.7); transform:translateY(-2px); }
  .btn-start:disabled { opacity:0.4; cursor:not-allowed; transform:none !important; }
  .players-list { margin-top:1.2rem; }
  .players-list h3 {
    font-size:0.82rem; text-transform:uppercase; letter-spacing:0.15em;
    color:#6b7280; margin-bottom:0.7rem;
  }
  .player-chip {
    display:inline-flex; align-items:center; gap:0.4rem;
    padding:0.35rem 0.8rem; border-radius:999px; font-size:0.88rem; font-weight:600;
    margin:0.25rem 0.25rem 0.25rem 0;
    border:1px solid rgba(255,255,255,0.15);
    animation:chipIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes chipIn {
    from { transform:scale(0) rotate(-10deg); opacity:0; }
    to   { transform:scale(1) rotate(0); opacity:1; }
  }
  .error-msg {
    background:rgba(248,113,113,0.15); border:1px solid rgba(248,113,113,0.4);
    border-radius:10px; padding:0.8rem 1rem; margin-top:1rem;
    font-size:0.88rem; color:#f87171; display:none;
  }

  /* ── GAME LAYOUT (with chat panel) ── */
  #gameScreen {
    display:none; flex-direction:row;
    width:100%; min-height:100vh;
  }

  /* Main game area */
  .game-main {
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:0.7rem; min-width:0;
    /* leave room for chat on desktop */
    transition: margin-right 0.3s;
  }

  .game-header {
    width:100%; max-width:900px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0.65rem 1rem;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(167,139,250,0.2);
    border-radius:14px; margin-bottom:0.7rem;
    gap:0.5rem; flex-wrap:wrap;
  }
  .header-title {
    font-size:1.2rem; font-weight:800;
    background:linear-gradient(135deg,#fbbf24,#a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .turn-indicator {
    display:flex; align-items:center; gap:0.5rem;
    padding:0.4rem 0.85rem; border-radius:999px;
    background:rgba(167,139,250,0.15);
    border:1px solid rgba(167,139,250,0.3);
    font-size:0.88rem; font-weight:600; transition:all 0.4s;
    white-space:nowrap;
  }
  .turn-indicator.my-turn {
    background:rgba(52,211,153,0.2); border-color:rgba(52,211,153,0.5);
    box-shadow:0 0 20px rgba(52,211,153,0.3); animation:pulse 1.5s ease infinite;
  }
  @keyframes pulse {
    0%,100%{ box-shadow:0 0 15px rgba(52,211,153,0.3); }
    50%    { box-shadow:0 0 30px rgba(52,211,153,0.6); }
  }

  /* ── SCOREBOARD ── */
  .scoreboard {
    width:100%; max-width:900px;
    display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:0.6rem;
  }
  .score-item {
    flex:1; min-width:80px;
    padding:0.5rem 0.65rem; border-radius:10px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    display:flex; align-items:center; gap:0.4rem;
    transition:all 0.4s; font-size:0.8rem;
  }
  .score-item.active {
    border-color:rgba(52,211,153,0.5); background:rgba(52,211,153,0.1);
    box-shadow:0 0 12px rgba(52,211,153,0.2);
  }
  .score-item .s-avatar { font-size:1.1rem; }
  .score-item .s-name { font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score-item .s-score { font-weight:800; font-size:0.95rem; color:var(--gold); }

  /* ── BOARD ── */
  .board-container {
    width:100%; max-width:900px; flex:1;
    display:flex; align-items:flex-start; justify-content:center;
  }
  #board {
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:clamp(3px,0.8vw,8px);
    width:100%; padding:0.3rem;
  }
  .card {
    aspect-ratio:1; perspective:800px; cursor:pointer;
    touch-action:manipulation;
  }
  .card.locked { cursor:default; pointer-events:none; }
  .card-inner {
    width:100%; height:100%; position:relative;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);
    border-radius:12px;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner { transform:rotateY(180deg); }
  .card-face {
    position:absolute; inset:0; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    font-size:clamp(0.9rem,2.5vw,2rem);
  }
  .card-back {
    background:var(--card-back);
    border:2px solid rgba(167,139,250,0.3);
    box-shadow:0 3px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    transition:box-shadow 0.2s;
    overflow:hidden; position:relative;
  }
  .card:hover:not(.flipped):not(.matched) .card-back {
    box-shadow:0 0 18px var(--glow), 0 3px 12px rgba(0,0,0,0.4);
    border-color:#a78bfa;
  }
  .card-back::before { content:'✦'; font-size:1.1em; color:rgba(167,139,250,0.5); }

  /* AAF ghost overlay on card back */
  .card-back .aaf-ghost {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:clamp(0.8rem,2.2vw,1.7rem);
    opacity:0.28; pointer-events:none;
    text-shadow:0 0 8px rgba(251,191,36,0.8);
    z-index:2;
  }

  .card-front {
    background:linear-gradient(135deg,#fff 0%,#f3f0ff 100%);
    border:2px solid rgba(167,139,250,0.5);
    transform:rotateY(180deg);
    box-shadow:0 3px 16px rgba(0,0,0,0.3);
  }
  .card.matched .card-front {
    border-color:var(--green); box-shadow:0 0 20px rgba(52,211,153,0.5);
    animation:matchPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes matchPop {
    0%  { transform:rotateY(180deg) scale(1); }
    50% { transform:rotateY(180deg) scale(1.15); }
    100%{ transform:rotateY(180deg) scale(1); }
  }
  .card.wrong .card-front {
    border-color:var(--red); box-shadow:0 0 20px rgba(248,113,113,0.5);
    animation:shake 0.5s ease;
  }
  @keyframes shake {
    0%,100%{ transform:rotateY(180deg) translateX(0); }
    20%    { transform:rotateY(180deg) translateX(-5px); }
    40%    { transform:rotateY(180deg) translateX(5px); }
    60%    { transform:rotateY(180deg) translateX(-3px); }
    80%    { transform:rotateY(180deg) translateX(3px); }
  }

  /* ── CHAT PANEL ── */
  .chat-panel {
    width: var(--chat-w);
    min-width: var(--chat-w);
    background: rgba(255,255,255,0.03);
    border-left: 1px solid rgba(167,139,250,0.15);
    display: flex; flex-direction: column;
    height: 100vh; position: sticky; top: 0;
    transition: transform 0.3s;
  }
  .chat-header {
    padding: 0.85rem 1rem;
    border-bottom: 1px solid rgba(167,139,250,0.15);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.85rem; font-weight: 700;
    color: #a78bfa; text-transform: uppercase; letter-spacing: 0.12em;
    flex-shrink:0;
  }
  .chat-header .chat-count {
    background: rgba(167,139,250,0.2); border-radius: 999px;
    padding: 0.1rem 0.5rem; font-size:0.75rem; color:#a78bfa;
  }
  .chat-toggle-btn {
    display:none; /* shown on mobile */
    background:none; border:none; color:#a78bfa; font-size:1.2rem;
    cursor:pointer; padding:0.2rem;
  }
  .chat-messages {
    flex:1; overflow-y:auto; padding:0.7rem;
    display:flex; flex-direction:column; gap:0.45rem;
    scroll-behavior: smooth;
    /* Custom scrollbar */
    scrollbar-width:thin; scrollbar-color:rgba(167,139,250,0.3) transparent;
  }
  .chat-messages::-webkit-scrollbar { width:4px; }
  .chat-messages::-webkit-scrollbar-thumb { background:rgba(167,139,250,0.3); border-radius:2px; }
  .chat-msg {
    display:flex; flex-direction:column; gap:0.1rem;
    animation: msgIn 0.25s ease;
  }
  @keyframes msgIn {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .chat-msg .cm-header {
    display:flex; align-items:center; gap:0.35rem;
    font-size:0.72rem; opacity:0.65;
  }
  .chat-msg .cm-avatar { font-size:0.85rem; }
  .chat-msg .cm-name { font-weight:700; }
  .chat-msg .cm-time { margin-left:auto; font-size:0.68rem; opacity:0.5; }
  .chat-msg .cm-text {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:8px; padding:0.4rem 0.6rem;
    font-size:0.875rem; line-height:1.35;
    word-break:break-word;
  }
  .chat-msg.mine .cm-text {
    background:rgba(124,58,237,0.25); border-color:rgba(167,139,250,0.3);
  }
  .chat-msg.system .cm-text {
    background:rgba(52,211,153,0.1); border-color:rgba(52,211,153,0.2);
    color:#34d399; font-size:0.78rem; text-align:center;
  }

  .chat-input-row {
    display:flex; gap:0.4rem; padding:0.7rem;
    border-top:1px solid rgba(167,139,250,0.15);
    flex-shrink:0;
  }
  .chat-input {
    flex:1; background:rgba(255,255,255,0.07);
    border:1px solid rgba(167,139,250,0.25);
    border-radius:10px; color:#fff; padding:0.55rem 0.75rem;
    font-size:14px; /* prevent zoom on iOS */
    outline:none; transition:border-color 0.2s;
  }
  .chat-input:focus { border-color:#a78bfa; }
  .chat-send-btn {
    background:linear-gradient(135deg,#7c3aed,#a78bfa);
    border:none; border-radius:10px; color:#fff;
    padding:0.55rem 0.8rem; font-size:1.1rem; cursor:pointer;
    transition:all 0.2s; flex-shrink:0;
    touch-action:manipulation;
  }
  .chat-send-btn:active { transform:scale(0.93); }

  /* Mobile chat fab */
  .chat-fab {
    display:none;
    position:fixed; bottom:1.2rem; right:1.2rem; z-index:500;
    width:52px; height:52px; border-radius:50%;
    background:linear-gradient(135deg,#7c3aed,#a78bfa);
    border:none; color:#fff; font-size:1.4rem;
    box-shadow:0 4px 20px rgba(124,58,237,0.5);
    cursor:pointer; align-items:center; justify-content:center;
    touch-action:manipulation;
    transition:transform 0.2s;
  }
  .chat-fab:active { transform:scale(0.9); }
  .chat-unread-badge {
    position:absolute; top:-2px; right:-2px;
    background:#f87171; border-radius:50%; width:18px; height:18px;
    font-size:0.65rem; font-weight:800;
    display:none; align-items:center; justify-content:center;
    color:#fff;
  }

  /* Mobile: chat as bottom sheet */
  @media(max-width:700px) {
    #gameScreen { flex-direction:column; }

    .chat-panel {
      position:fixed; inset:0; top:auto;
      width:100%; min-width:unset;
      height:65vh;
      border-left:none;
      border-top:1px solid rgba(167,139,250,0.3);
      border-radius:20px 20px 0 0;
      z-index:450;
      transform: translateY(100%);
      transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);
      background:rgba(10,10,26,0.97);
      backdrop-filter:blur(20px);
    }
    .chat-panel.open { transform:translateY(0); }
    .chat-panel .chat-header { border-radius:20px 20px 0 0; }
    .chat-toggle-btn { display:block; }
    .chat-fab { display:flex; }
    #board { grid-template-columns:repeat(5,1fr); gap:3px; }
  }
  @media(max-width:380px) {
    #board { grid-template-columns:repeat(4,1fr); gap:2px; }
  }

  /* ── COMBO POPUP ── */
  .combo-popup {
    position:fixed; top:18%; left:50%; transform:translateX(-50%);
    z-index:100; pointer-events:none;
    font-size:2.5rem; font-weight:900;
    background:linear-gradient(135deg,#fbbf24,#f87171);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 0 20px rgba(251,191,36,0.8));
    animation:popupAnim 1.2s ease forwards; text-align:center;
  }
  @keyframes popupAnim {
    0%  { opacity:0; transform:translateX(-50%) scale(0.5) translateY(0); }
    20% { opacity:1; transform:translateX(-50%) scale(1.2) translateY(-10px); }
    60% { opacity:1; transform:translateX(-50%) scale(1) translateY(-20px); }
    100%{ opacity:0; transform:translateX(-50%) scale(0.8) translateY(-60px); }
  }

  /* ── CONFETTI ── */
  .confetti-piece {
    position:fixed; z-index:200; pointer-events:none;
    animation:confettiFall 1.5s ease forwards;
  }
  @keyframes confettiFall {
    0%  { transform:translateY(-20px) rotate(0); opacity:1; }
    100%{ transform:translateY(100vh) rotate(720deg); opacity:0; }
  }

  /* ── GAME OVER ── */
  #gameOverScreen {
    position:fixed; inset:0; z-index:300;
    background:rgba(0,0,0,0.85); backdrop-filter:blur(10px);
    display:none; align-items:center; justify-content:center;
    padding:1rem;
  }
  .gameover-card {
    background:linear-gradient(135deg,#1a1a3e,#2d1b69);
    border:1px solid rgba(167,139,250,0.4);
    border-radius:24px; padding:2.5rem;
    width:min(520px,92vw); text-align:center;
    box-shadow:0 0 80px rgba(167,139,250,0.3);
    animation:slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1);
    max-height:90vh; overflow-y:auto;
  }
  @keyframes slideUp {
    from{ transform:translateY(60px) scale(0.9); opacity:0; }
    to  { transform:translateY(0) scale(1); opacity:1; }
  }
  .winner-crown { font-size:4rem; animation:spin 2s ease infinite alternate; display:block; }
  @keyframes spin {
    from{ transform:rotate(-15deg) scale(1); }
    to  { transform:rotate(15deg) scale(1.1); }
  }
  .winner-title { font-size:1.3rem; color:#a78bfa; margin:0.4rem 0; }
  .winner-name  { font-size:2rem; font-weight:900; color:var(--gold); margin-bottom:1.2rem; }
  .final-scores {
    background:rgba(0,0,0,0.3); border-radius:12px; padding:0.8rem;
    margin-bottom:1.5rem; text-align:left;
  }
  .final-score-row {
    display:flex; align-items:center; gap:0.7rem; padding:0.45rem 0;
    border-bottom:1px solid rgba(255,255,255,0.08); font-size:0.95rem;
  }
  .final-score-row:last-child{ border-bottom:none; }
  .rank-badge {
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:0.8rem;
  }
  .rank-1 { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#000; }
  .rank-2 { background:linear-gradient(135deg,#9ca3af,#6b7280); color:#fff; }
  .rank-3 { background:linear-gradient(135deg,#92400e,#b45309); color:#fff; }
  .rank-other{ background:rgba(255,255,255,0.1); color:#9ca3af; }

  /* ── NOTIFICATION ── */
  .notification {
    position:fixed; top:1rem; right:1rem; z-index:400;
    padding:0.8rem 1.2rem; border-radius:12px; font-weight:600;
    font-size:0.9rem; max-width:260px;
    animation:notifIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    pointer-events:none;
  }
  @keyframes notifIn {
    from{ transform:translateX(100px); opacity:0; }
    to  { transform:translateX(0); opacity:1; }
  }
  .notif-success{ background:linear-gradient(135deg,#065f46,#059669); border:1px solid #34d399; }
  .notif-info   { background:linear-gradient(135deg,#1e3a5f,#2563eb); border:1px solid #60a5fa; }
  .notif-warning{ background:linear-gradient(135deg,#78350f,#d97706); border:1px solid #fbbf24; }

  /* ── RIPPLE ── */
  .ripple {
    position:absolute; border-radius:50%;
    background:rgba(167,139,250,0.4);
    transform:scale(0); animation:rippleOut 0.6s linear; pointer-events:none;
  }
  @keyframes rippleOut { to{ transform:scale(4); opacity:0; } }

  /* ── AAF indicator ── */
  .aaf-badge {
    display:none;
    position:fixed; top:0.8rem; left:50%; transform:translateX(-50%);
    z-index:600; pointer-events:none;
    background:linear-gradient(135deg,rgba(251,191,36,0.9),rgba(245,158,11,0.9));
    color:#000; font-size:0.75rem; font-weight:800;
    padding:0.3rem 0.9rem; border-radius:999px;
    letter-spacing:0.15em; text-transform:uppercase;
    box-shadow:0 0 20px rgba(251,191,36,0.5);
    animation:badgePulse 2s ease infinite;
  }
  @keyframes badgePulse {
    0%,100%{ box-shadow:0 0 15px rgba(251,191,36,0.4); }
    50%    { box-shadow:0 0 30px rgba(251,191,36,0.8); }
  }
</style>
</head>
<body>

<div id="particles"></div>

<!-- AAF indicator (only visible to aaf user) -->
<div class="aaf-badge" id="aafBadge">👁 Tüm Görüş Aktif</div>

<!-- ═════════ LOBBY ═════════ -->
<div id="lobbyScreen" class="screen">
  <div class="game-title">🍎 Meyve Memory</div>
  <p class="game-subtitle">Çok Oyunculu Kart Eşleştirme</p>

  <div class="lobby-card">
    <div class="input-group">
      <label>Oyuncu Adın</label>
      <input type="text" id="playerName" placeholder="Adını gir..." maxlength="16"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <button class="btn btn-primary" onclick="joinLobby()">🚪 Lobiye Katıl</button>

    <div class="players-list" id="playersList" style="display:none">
      <h3>Bekleyen Oyuncular (<span id="playerCount">0</span>/12)</h3>
      <div id="playersChips"></div>
      <button class="btn btn-start" id="startBtn" onclick="startGame()" disabled>
        ▶ Oyunu Başlat (En Az 2 Oyuncu)
      </button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- ═════════ GAME ═════════ -->
<div id="gameScreen" class="screen" style="display:none">

  <!-- Main area -->
  <div class="game-main">
    <div class="game-header">
      <span class="header-title">🍎 Meyve Memory</span>
      <div class="turn-indicator" id="turnIndicator">⏳ Yükleniyor...</div>
      <span id="matchCount" style="color:#a78bfa;font-size:0.85rem;white-space:nowrap;"></span>
    </div>

    <div class="scoreboard" id="scoreboard"></div>

    <div class="board-container">
      <div id="board"></div>
    </div>
  </div>

  <!-- Chat panel -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <span>💬 Sohbet</span>
      <span class="chat-count" id="chatCount">0</span>
      <button class="chat-toggle-btn" onclick="toggleChat()" title="Kapat">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" type="text"
             placeholder="Mesaj yaz..." maxlength="120"
             autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="chat-send-btn" onclick="sendChat()">➤</button>
    </div>
  </div>
</div>

<!-- Chat FAB (mobile) -->
<button class="chat-fab" id="chatFab" onclick="toggleChat()">
  💬
  <span class="chat-unread-badge" id="unreadBadge">0</span>
</button>

<!-- ═════════ GAME OVER ═════════ -->
<div id="gameOverScreen">
  <div class="gameover-card">
    <span class="winner-crown">🏆</span>
    <div class="winner-title">Oyun Bitti! Kazanan:</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="final-scores" id="finalScores"></div>
    <button class="btn btn-start" onclick="playAgain()" style="width:100%">
      🔄 Tekrar Oyna
    </button>
  </div>
</div>

<script>
// ════════════════════════════════════════════
//  AUDIO
// ════════════════════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function getCtx() {
  if (!ctx) ctx = new AudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function playTone(freq, type='sine', duration=0.15, vol=0.3, delay=0) {
  try {
    const c=getCtx(), osc=c.createOscillator(), gain=c.createGain();
    osc.connect(gain); gain.connect(c.destination);
    osc.type=type; osc.frequency.value=freq;
    const t=c.currentTime+delay;
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(vol,t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
    osc.start(t); osc.stop(t+duration+0.05);
  } catch(e){}
}
function playFlipSound()    { playTone(440,'sine',0.08,0.15); playTone(660,'sine',0.06,0.1,0.04); }
function playMatchSound()   { [523,659,784,1047].forEach((f,i)=>playTone(f,'triangle',0.25,0.4,i*0.08)); }
function playMismatchSound(){ playTone(180,'sawtooth',0.2,0.3); playTone(140,'sawtooth',0.18,0.2,0.1); }
function playWinSound()     { [523,659,784,880,1047,880,1047].forEach((f,i)=>playTone(f,'triangle',0.3,0.5,i*0.12)); }
function playClickSound()   { playTone(800,'square',0.04,0.1); }
function playChatSound()    { playTone(1100,'sine',0.08,0.12); }

// ════════════════════════════════════════════
//  PARTICLES
// ════════════════════════════════════════════
function createParticles() {
  const container=document.getElementById('particles');
  const colors=['#a78bfa','#fbbf24','#34d399','#f87171','#60a5fa'];
  for(let i=0;i<30;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.cssText=`left:${Math.random()*100}%;width:${2+Math.random()*4}px;height:${2+Math.random()*4}px;background:${colors[i%colors.length]};animation-duration:${5+Math.random()*10}s;animation-delay:${Math.random()*8}s;`;
    container.appendChild(p);
  }
}
createParticles();

// ════════════════════════════════════════════
//  CONFETTI
// ════════════════════════════════════════════
function launchConfetti(x,y,count=20){
  const colors=['#fbbf24','#a78bfa','#34d399','#f87171','#60a5fa','#fff'];
  for(let i=0;i<count;i++){
    const c=document.createElement('div');
    c.className='confetti-piece';
    c.style.cssText=`left:${x+(Math.random()-0.5)*180}px;top:${y}px;background:${colors[i%colors.length]};border-radius:${Math.random()>.5?'50%':'2px'};width:${6+Math.random()*7}px;height:${6+Math.random()*7}px;animation-duration:${1+Math.random()}s;animation-delay:${Math.random()*0.3}s;`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}
function launchFullConfetti(){
  for(let i=0;i<8;i++) setTimeout(()=>launchConfetti(window.innerWidth*Math.random(),0,22),i*150);
}

// ════════════════════════════════════════════
//  POPUP / NOTIFICATION
// ════════════════════════════════════════════
function showCombo(text,emoji=''){
  const el=document.createElement('div');
  el.className='combo-popup';
  el.innerHTML=`${emoji}<br>${text}`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}
function showNotification(msg,type='info',duration=2500){
  const el=document.createElement('div');
  el.className=`notification notif-${type}`;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{
    el.style.animation='notifIn 0.3s reverse';
    setTimeout(()=>el.remove(),300);
  },duration);
}

// ════════════════════════════════════════════
//  AAF DETECT
// ════════════════════════════════════════════
const isAAF = new URLSearchParams(window.location.search).get('aaf') === 'true';
if(isAAF) document.getElementById('aafBadge').style.display='block';

// ════════════════════════════════════════════
//  SOCKET
// ════════════════════════════════════════════
const socket = io();
let myId = null, isHost = false, gameBoard = [], matchedCount = 0, currentPlayerId = null;

socket.on('welcome', ({id}) => { myId = id; });

socket.on('error', ({message}) => {
  const errEl=document.getElementById('errorMsg');
  errEl.textContent=message; errEl.style.display='block';
  setTimeout(()=>errEl.style.display='none',3000);
  showNotification('⚠ '+message,'warning');
});

socket.on('lobbyUpdate', ({players, maxPlayers}) => {
  const list=document.getElementById('playersList');
  const chips=document.getElementById('playersChips');
  const startBtn=document.getElementById('startBtn');
  const countEl=document.getElementById('playerCount');
  list.style.display='block'; countEl.textContent=players.length;
  chips.innerHTML='';
  players.forEach(p=>{
    const chip=document.createElement('div');
    chip.className='player-chip';
    chip.style.cssText=`background:${p.color+'22'};border-color:${p.color+'66'};color:${p.color}`;
    chip.innerHTML=`${p.avatar||'🎮'} ${p.name}`;
    chips.appendChild(chip);
  });
  if(players.length>0 && players[0].id===myId){
    isHost=true; startBtn.disabled=players.length<2; startBtn.style.display='block';
    startBtn.textContent='▶ Oyunu Başlat';
  } else {
    isHost=false;
    startBtn.style.display=players.length>0?'block':'none';
    startBtn.disabled=true; startBtn.textContent='⏳ Host Oyunu Başlatacak...';
  }
});

socket.on('gameStarted', ({board, playerOrder, currentPlayer, scoreboard}) => {
  gameBoard=board; currentPlayerId=currentPlayer; matchedCount=0;
  document.getElementById('lobbyScreen').style.display='none';
  const gs=document.getElementById('gameScreen');
  gs.style.display='flex';
  renderBoard(board);
  updateScoreboard(scoreboard, playerOrder, currentPlayer);
  updateTurnIndicator(currentPlayer, scoreboard);
  updateMatchCount();
  showNotification('🎮 Oyun başladı! İyi eğlenceler!','success');
  playTone(523,'triangle',0.5,0.4);
  addSystemMsg('Oyun başladı! 🎮');
});

socket.on('gameState', ({board, currentPlayer, scoreboard, playerOrder, locked}) => {
  gameBoard=board; currentPlayerId=currentPlayer;
  updateScoreboard(scoreboard, playerOrder, currentPlayer);
  updateTurnIndicator(currentPlayer, scoreboard);
  updateBoardState(board, locked);
  updateMatchCount();
});

socket.on('cardFlipped', ({cardId, fruit, playerId}) => {
  const cardEl=document.querySelector(`.card[data-id="${cardId}"]`);
  if(!cardEl) return;
  cardEl.classList.add('flipped');
  cardEl.querySelector('.card-front').textContent=fruit;
  if(playerId!==myId) playFlipSound();
});

socket.on('cardsMatched', ({cardIds, playerId, playerName, scoreboard}) => {
  cardIds.forEach(id=>{
    const el=document.querySelector(`.card[data-id="${id}"]`);
    if(!el) return;
    el.classList.add('matched'); el.classList.remove('wrong');
    el.style.pointerEvents='none';
    // Remove aaf ghost on matched
    const ghost=el.querySelector('.aaf-ghost');
    if(ghost) ghost.remove();
    const rect=el.getBoundingClientRect();
    launchConfetti(rect.left+rect.width/2, rect.top, 10);
  });
  matchedCount++; updateMatchCount(); playMatchSound();
  if(playerId===myId) showCombo('+10 PUAN!','🎉');
  else showNotification(`${playerName} eşleştirdi! +10 🎯`,'success',2000);
  updateScoreboardHighlight(scoreboard);
});

socket.on('cardsMismatched', ({cardIds, nextPlayer}) => {
  cardIds.forEach(id=>{
    const el=document.querySelector(`.card[data-id="${id}"]`);
    if(!el) return;
    el.classList.add('wrong');
    setTimeout(()=>{
      el.classList.remove('flipped','wrong');
      el.querySelector('.card-front').textContent='';
      // restore aaf ghost if needed
      if(isAAF){
        const card=gameBoard.find(c=>c.id==id);
        if(card && card.aafVisible){
          let ghost=el.querySelector('.aaf-ghost');
          if(!ghost){
            ghost=document.createElement('div');
            ghost.className='aaf-ghost';
            el.querySelector('.card-back').appendChild(ghost);
          }
          ghost.textContent=card.fruit;
        }
      }
    },1100);
  });
  currentPlayerId=nextPlayer; playMismatchSound();
  if(nextPlayer===myId) setTimeout(()=>showNotification('🎯 Senin sıran!','info',2000),800);
});

socket.on('gameOver', ({scoreboard, winner}) => {
  playWinSound(); launchFullConfetti();
  document.getElementById('winnerName').textContent=`${winner.avatar||'🏆'} ${winner.name} — ${winner.score} puan`;
  const fs=document.getElementById('finalScores');
  fs.innerHTML=scoreboard.map((p,i)=>`
    <div class="final-score-row">
      <div class="rank-badge rank-${i<3?i+1:'other'}">${i+1}</div>
      <span style="font-size:1.2rem">${p.avatar||'🎮'}</span>
      <span style="flex:1;font-weight:600;color:${p.color||'#fff'}">${p.name}</span>
      <span style="color:var(--gold);font-weight:800">${p.score} pts</span>
    </div>
  `).join('');
  document.getElementById('gameOverScreen').style.display='flex';
  showCombo('OYUN BİTTİ!','🏆');
  addSystemMsg(`Oyun bitti! Kazanan: ${winner.name} 🏆`);
});

socket.on('returnToLobby', () => {
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  document.getElementById('lobbyScreen').style.display='flex';
  document.getElementById('playersList').style.display='none';
  showNotification('🏠 Lobiye dönüldü!','info');
});

// ── CHAT EVENTS ──
let unreadCount = 0;
let chatOpen = false;

socket.on('chatMessage', ({playerId, playerName, playerColor, playerAvatar, text, ts}) => {
  addChatMsg({playerId, playerName, playerColor, playerAvatar, text, ts});
  if(playerId !== myId) {
    playChatSound();
    // Show unread badge if chat closed on mobile
    if(window.innerWidth<=700 && !chatOpen){
      unreadCount++;
      const badge=document.getElementById('unreadBadge');
      badge.style.display='flex'; badge.textContent=unreadCount>9?'9+':unreadCount;
    }
  }
});

// ════════════════════════════════════════════
//  LOBBY FUNCTIONS
// ════════════════════════════════════════════
function joinLobby() {
  playClickSound();
  const name=document.getElementById('playerName').value.trim();
  if(!name){ showNotification('Lütfen bir isim gir!','warning'); return; }
  socket.emit('joinLobby', {name, aaf: isAAF});
}
function startGame()  { playClickSound(); socket.emit('startGame'); }
function playAgain()  { playClickSound(); socket.emit('playAgain'); }

document.getElementById('playerName').addEventListener('keydown', e=>{
  if(e.key==='Enter') joinLobby();
});

// ════════════════════════════════════════════
//  BOARD RENDERING
// ════════════════════════════════════════════
function renderBoard(board) {
  gameBoard = board;
  const boardEl=document.getElementById('board');
  boardEl.innerHTML='';
  board.forEach(card=>{
    const el=document.createElement('div');
    el.className='card'+(card.matched?' flipped matched':'');
    el.dataset.id=card.id;

    // Build card-back content
    let backExtra='';
    if(isAAF && card.aafVisible){
      backExtra=`<div class="aaf-ghost">${card.fruit}</div>`;
    }

    el.innerHTML=`
      <div class="card-inner">
        <div class="card-face card-back">${backExtra}</div>
        <div class="card-face card-front">${card.matched?card.fruit:''}</div>
      </div>
    `;
    el.addEventListener('click', ()=>onCardClick(el, card.id));
    if(card.matched) el.style.pointerEvents='none';
    boardEl.appendChild(el);
  });
}

function updateBoardState(board, locked) {
  gameBoard = board;
  board.forEach(card=>{
    const el=document.querySelector(`.card[data-id="${card.id}"]`);
    if(!el) return;
    if(card.matched){
      el.classList.add('matched','flipped');
      el.querySelector('.card-front').textContent=card.fruit;
      el.style.pointerEvents='none';
      // remove aaf ghost
      const ghost=el.querySelector('.aaf-ghost');
      if(ghost) ghost.remove();
    } else {
      // Update aaf ghost for un-flipped cards
      if(isAAF && card.aafVisible){
        let ghost=el.querySelector('.aaf-ghost');
        if(!ghost){
          ghost=document.createElement('div');
          ghost.className='aaf-ghost';
          el.querySelector('.card-back').appendChild(ghost);
        }
        ghost.textContent=card.fruit;
      }
    }
    if(locked || currentPlayerId!==myId) el.classList.add('locked');
    else if(!card.matched && !card.flipped) el.classList.remove('locked');
  });
}

function onCardClick(el, cardId) {
  playClickSound();
  if(currentPlayerId!==myId){ showNotification('⏳ Senin sıran değil!','warning',1500); return; }
  if(el.classList.contains('flipped')||el.classList.contains('matched')) return;
  const rect=el.getBoundingClientRect();
  const r=document.createElement('div');
  r.className='ripple';
  r.style.cssText=`width:${rect.width}px;height:${rect.height}px;left:0;top:0;`;
  el.appendChild(r); setTimeout(()=>r.remove(),700);
  el.classList.add('flipped'); playFlipSound();
  socket.emit('flipCard', {cardId});
}

function updateMatchCount() {
  const matched=document.querySelectorAll('.card.matched').length;
  const pairs=Math.floor(matched/2);
  document.getElementById('matchCount').textContent=`🃏 ${pairs}/20 çift`;
}

// ════════════════════════════════════════════
//  SCOREBOARD
// ════════════════════════════════════════════
function updateScoreboard(scoreboard, playerOrder, currentPlayer) {
  document.getElementById('scoreboard').innerHTML=scoreboard.map(p=>`
    <div class="score-item${p.id===currentPlayer?' active':''}">
      <span class="s-avatar">${p.avatar||'🎮'}</span>
      <span class="s-name" style="color:${p.color||'#fff'}">${p.name}${p.id===myId?' (Sen)':''}</span>
      <span class="s-score">${p.score}</span>
    </div>
  `).join('');
}
function updateScoreboardHighlight(scoreboard) {
  scoreboard.forEach(p=>{
    document.querySelectorAll('.score-item').forEach(item=>{
      const name=item.querySelector('.s-name').textContent.replace(' (Sen)','');
      if(name===p.name){
        item.querySelector('.s-score').textContent=p.score;
        item.style.animation='none'; item.offsetHeight;
        item.style.animation='chipIn 0.4s cubic-bezier(0.34,1.56,0.64,1)';
      }
    });
  });
}
function updateTurnIndicator(currentPlayer, scoreboard) {
  const el=document.getElementById('turnIndicator');
  const player=scoreboard?.find(p=>p.id===currentPlayer);
  if(!player){ el.textContent='⏳ Bekleniyor...'; return; }
  const isMe=currentPlayer===myId;
  el.className='turn-indicator'+(isMe?' my-turn':'');
  el.innerHTML=isMe
    ?`<span style="animation:pulse 0.5s infinite">✨</span> Senin Sıran!`
    :`${player.avatar||'🎮'} ${player.name}'in Sırası`;
}

// ════════════════════════════════════════════
//  CHAT
// ════════════════════════════════════════════
function addChatMsg({playerId, playerName, playerColor, playerAvatar, text, ts}) {
  const msgs=document.getElementById('chatMessages');
  const div=document.createElement('div');
  const isMe=playerId===myId;
  div.className='chat-msg'+(isMe?' mine':'');
  const time=new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  div.innerHTML=`
    <div class="cm-header">
      <span class="cm-avatar">${playerAvatar}</span>
      <span class="cm-name" style="color:${playerColor}">${playerName}</span>
      <span class="cm-time">${time}</span>
    </div>
    <div class="cm-text">${escHtml(text)}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;

  // update count badge
  const cnt=document.getElementById('chatCount');
  cnt.textContent=msgs.children.length;
}

function addSystemMsg(text) {
  const msgs=document.getElementById('chatMessages');
  const div=document.createElement('div');
  div.className='chat-msg system';
  div.innerHTML=`<div class="cm-text">${text}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

function sendChat() {
  const input=document.getElementById('chatInput');
  const text=input.value.trim();
  if(!text) return;
  socket.emit('chatMessage', {text});
  input.value='';
  input.focus();
}

document.getElementById('chatInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); sendChat(); }
});

function toggleChat() {
  const panel=document.getElementById('chatPanel');
  chatOpen=!chatOpen;
  if(chatOpen){
    panel.classList.add('open');
    unreadCount=0;
    const badge=document.getElementById('unreadBadge');
    badge.style.display='none'; badge.textContent='0';
    // scroll to bottom
    const msgs=document.getElementById('chatMessages');
    setTimeout(()=>msgs.scrollTop=msgs.scrollHeight, 350);
  } else {
    panel.classList.remove('open');
  }
}

// On desktop, chat is always open
function checkChatLayout(){
  if(window.innerWidth>700){
    document.getElementById('chatPanel').classList.add('open');
    chatOpen=true;
  }
}
checkChatLayout();
window.addEventListener('resize', checkChatLayout);

function escHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
</script>
</body>
</html>
