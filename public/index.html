<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍎 Meyve Memory — Çok Oyunculu</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  @import url('data:text/css,');

  :root {
    --bg: #0a0a1a;
    --card-back: linear-gradient(135deg, #1a1a3e 0%, #2d1b69 50%, #1a1a3e 100%);
    --card-front: linear-gradient(135deg, #ffffff 0%, #f0f0ff 100%);
    --accent: #a78bfa;
    --gold: #fbbf24;
    --green: #34d399;
    --red: #f87171;
    --glow: rgba(167,139,250,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
    color: #fff;
  }

  /* ── PARTICLES BG ── */
  #particles {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    overflow:hidden;
  }
  .particle {
    position:absolute;
    width:4px; height:4px;
    border-radius:50%;
    background: var(--accent);
    opacity:0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform:translateY(100vh) scale(0); opacity:0; }
    10%  { opacity:0.8; }
    90%  { opacity:0.3; }
    100% { transform:translateY(-10vh) scale(1.5); opacity:0; }
  }

  /* ── SCREENS ── */
  .screen { position:relative; z-index:1; min-height:100vh; }

  /* ── LOBBY ── */
  #lobbyScreen {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:2rem; min-height:100vh;
  }

  .game-title {
    font-size:clamp(2.5rem,8vw,5rem);
    font-weight:900;
    background: linear-gradient(135deg, #fbbf24, #a78bfa, #34d399, #f87171);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
    text-align:center;
    filter: drop-shadow(0 0 30px rgba(167,139,250,0.5));
    margin-bottom: 0.3rem;
  }
  @keyframes gradientShift {
    0%,100% { background-position:0% 50%; }
    50%      { background-position:100% 50%; }
  }

  .game-subtitle {
    font-size:1.1rem; color:#a78bfa; text-align:center; margin-bottom:2.5rem;
    letter-spacing:0.2em; text-transform:uppercase; opacity:0.8;
  }

  .lobby-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(167,139,250,0.3);
    border-radius:24px;
    padding:2.5rem;
    width:min(500px,95vw);
    box-shadow: 0 0 60px rgba(167,139,250,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
  }

  .input-group { margin-bottom:1.5rem; }
  .input-group label {
    display:block; font-size:0.85rem; color:#a78bfa;
    text-transform:uppercase; letter-spacing:0.15em; margin-bottom:0.6rem;
  }
  .input-group input {
    width:100%; padding:0.9rem 1.2rem;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(167,139,250,0.3);
    border-radius:12px; color:#fff; font-size:1.1rem;
    outline:none; transition:all 0.3s;
  }
  .input-group input:focus {
    border-color:#a78bfa;
    box-shadow:0 0 20px rgba(167,139,250,0.3);
    background:rgba(255,255,255,0.1);
  }

  .btn {
    width:100%; padding:1rem; border:none; border-radius:14px;
    font-size:1.1rem; font-weight:700; cursor:pointer;
    transition:all 0.25s; position:relative; overflow:hidden;
    text-transform:uppercase; letter-spacing:0.1em;
  }
  .btn::after {
    content:''; position:absolute; inset:0;
    background:rgba(255,255,255,0.1);
    opacity:0; transition:opacity 0.2s;
  }
  .btn:hover::after { opacity:1; }
  .btn:active { transform:scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #7c3aed, #a78bfa);
    color:#fff;
    box-shadow:0 4px 25px rgba(124,58,237,0.5);
  }
  .btn-primary:hover { box-shadow:0 6px 35px rgba(124,58,237,0.7); transform:translateY(-2px); }

  .btn-start {
    background: linear-gradient(135deg, #059669, #34d399);
    color:#fff;
    box-shadow:0 4px 25px rgba(5,150,105,0.5);
    margin-top:1rem;
  }
  .btn-start:hover { box-shadow:0 6px 35px rgba(5,150,105,0.7); transform:translateY(-2px); }

  .btn-start:disabled { opacity:0.4; cursor:not-allowed; transform:none !important; }

  .players-list {
    margin-top:1.5rem;
  }
  .players-list h3 {
    font-size:0.85rem; text-transform:uppercase; letter-spacing:0.15em;
    color:#6b7280; margin-bottom:0.8rem;
  }
  .player-chip {
    display:inline-flex; align-items:center; gap:0.4rem;
    padding:0.4rem 0.9rem; border-radius:999px; font-size:0.9rem; font-weight:600;
    margin:0.3rem 0.3rem 0.3rem 0;
    border:1px solid rgba(255,255,255,0.15);
    animation: chipIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes chipIn {
    from { transform:scale(0) rotate(-10deg); opacity:0; }
    to   { transform:scale(1) rotate(0); opacity:1; }
  }

  .error-msg {
    background:rgba(248,113,113,0.15); border:1px solid rgba(248,113,113,0.4);
    border-radius:10px; padding:0.8rem 1rem; margin-top:1rem;
    font-size:0.9rem; color:#f87171; display:none;
  }

  /* ── GAME SCREEN ── */
  #gameScreen {
    display:none; flex-direction:column; align-items:center;
    padding:1rem; min-height:100vh;
  }

  .game-header {
    width:100%; max-width:1200px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0.8rem 1.2rem;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(167,139,250,0.2);
    border-radius:16px;
    margin-bottom:1rem;
    flex-wrap:wrap; gap:0.5rem;
  }

  .header-title {
    font-size:1.4rem; font-weight:800;
    background: linear-gradient(135deg, #fbbf24, #a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  .turn-indicator {
    display:flex; align-items:center; gap:0.6rem;
    padding:0.5rem 1rem; border-radius:999px;
    background:rgba(167,139,250,0.15);
    border:1px solid rgba(167,139,250,0.3);
    font-size:0.95rem; font-weight:600;
    transition:all 0.4s;
  }
  .turn-indicator.my-turn {
    background:rgba(52,211,153,0.2);
    border-color:rgba(52,211,153,0.5);
    box-shadow:0 0 20px rgba(52,211,153,0.3);
    animation: pulse 1.5s ease infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 15px rgba(52,211,153,0.3); }
    50%      { box-shadow:0 0 30px rgba(52,211,153,0.6); }
  }

  /* ── SCOREBOARD ── */
  .scoreboard {
    width:100%; max-width:1200px;
    display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.8rem;
  }
  .score-item {
    flex:1; min-width:100px;
    padding:0.6rem 0.8rem; border-radius:12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    display:flex; align-items:center; gap:0.5rem;
    transition:all 0.4s; font-size:0.85rem;
  }
  .score-item.active {
    border-color:rgba(52,211,153,0.5);
    background:rgba(52,211,153,0.1);
    box-shadow:0 0 15px rgba(52,211,153,0.2);
  }
  .score-item .s-avatar { font-size:1.3rem; }
  .score-item .s-name { font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .score-item .s-score {
    font-weight:800; font-size:1rem;
    color: var(--gold);
  }

  /* ── BOARD ── */
  .board-container {
    width:100%; max-width:1200px;
    flex:1; display:flex; align-items:flex-start; justify-content:center;
  }

  #board {
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    gap:clamp(4px,1vw,10px);
    width:100%;
    padding:0.5rem;
  }

  /* ── CARD ── */
  .card {
    aspect-ratio:1;
    perspective:800px;
    cursor:pointer;
  }
  .card.locked { cursor:default; pointer-events:none; }

  .card-inner {
    width:100%; height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.55s cubic-bezier(0.4,0,0.2,1);
    border-radius:14px;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner { transform:rotateY(180deg); }

  .card-face {
    position:absolute; inset:0;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    font-size:clamp(1rem,3vw,2.2rem);
  }

  .card-back {
    background: var(--card-back);
    border:2px solid rgba(167,139,250,0.3);
    box-shadow:0 4px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    font-size:clamp(1rem,2.5vw,1.8rem);
    transition:box-shadow 0.2s;
  }
  .card:hover:not(.flipped):not(.matched) .card-back {
    box-shadow:0 0 20px var(--glow), 0 4px 15px rgba(0,0,0,0.4);
    border-color:#a78bfa;
    transform:scale(1.03);
  }

  /* Pattern on back */
  .card-back::before {
    content: '✦';
    font-size:1.2em;
    color:rgba(167,139,250,0.5);
  }

  .card-front {
    background: linear-gradient(135deg, #fff 0%, #f3f0ff 100%);
    border:2px solid rgba(167,139,250,0.5);
    transform:rotateY(180deg);
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
  }

  .card.matched .card-front {
    border-color: var(--green);
    box-shadow:0 0 25px rgba(52,211,153,0.5);
    animation: matchPop 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes matchPop {
    0%  { transform:rotateY(180deg) scale(1); }
    50% { transform:rotateY(180deg) scale(1.15); }
    100%{ transform:rotateY(180deg) scale(1); }
  }

  .card.wrong .card-front {
    border-color: var(--red);
    box-shadow:0 0 25px rgba(248,113,113,0.5);
    animation: shake 0.5s ease;
  }
  @keyframes shake {
    0%,100%{ transform:rotateY(180deg) translateX(0); }
    20%    { transform:rotateY(180deg) translateX(-6px); }
    40%    { transform:rotateY(180deg) translateX(6px); }
    60%    { transform:rotateY(180deg) translateX(-4px); }
    80%    { transform:rotateY(180deg) translateX(4px); }
  }

  .matched-overlay {
    position:absolute; inset:0; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    z-index:2; transform:rotateY(180deg);
    pointer-events:none;
  }

  /* ── COMBO POPUP ── */
  .combo-popup {
    position:fixed; top:20%; left:50%; transform:translateX(-50%);
    z-index:100; pointer-events:none;
    font-size:3rem; font-weight:900;
    background: linear-gradient(135deg, #fbbf24, #f87171);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    filter:drop-shadow(0 0 20px rgba(251,191,36,0.8));
    animation:popupAnim 1.2s ease forwards;
    text-align:center;
  }
  @keyframes popupAnim {
    0%   { opacity:0; transform:translateX(-50%) scale(0.5) translateY(0); }
    20%  { opacity:1; transform:translateX(-50%) scale(1.2) translateY(-10px); }
    60%  { opacity:1; transform:translateX(-50%) scale(1) translateY(-20px); }
    100% { opacity:0; transform:translateX(-50%) scale(0.8) translateY(-60px); }
  }

  /* ── CONFETTI ── */
  .confetti-piece {
    position:fixed; width:10px; height:10px; z-index:200;
    pointer-events:none;
    animation: confettiFall 1.5s ease forwards;
  }
  @keyframes confettiFall {
    0%   { transform:translateY(-20px) rotate(0); opacity:1; }
    100% { transform:translateY(100vh) rotate(720deg); opacity:0; }
  }

  /* ── GAME OVER ── */
  #gameOverScreen {
    position:fixed; inset:0; z-index:300;
    background:rgba(0,0,0,0.8); backdrop-filter:blur(10px);
    display:none; align-items:center; justify-content:center;
  }

  .gameover-card {
    background:linear-gradient(135deg,#1a1a3e,#2d1b69);
    border:1px solid rgba(167,139,250,0.4);
    border-radius:28px; padding:3rem;
    width:min(550px,90vw); text-align:center;
    box-shadow:0 0 80px rgba(167,139,250,0.3);
    animation:slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp {
    from { transform:translateY(60px) scale(0.9); opacity:0; }
    to   { transform:translateY(0) scale(1); opacity:1; }
  }

  .winner-crown { font-size:5rem; animation:spin 2s ease infinite alternate; display:block; }
  @keyframes spin {
    from { transform:rotate(-15deg) scale(1); }
    to   { transform:rotate(15deg) scale(1.1); }
  }
  .winner-title { font-size:1.5rem; color:#a78bfa; margin:0.5rem 0; }
  .winner-name  { font-size:2.5rem; font-weight:900; color:var(--gold); margin-bottom:1.5rem; }

  .final-scores {
    background:rgba(0,0,0,0.3); border-radius:14px; padding:1rem;
    margin-bottom:2rem; text-align:left;
  }
  .final-score-row {
    display:flex; align-items:center; gap:0.8rem; padding:0.5rem 0;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-size:1rem;
  }
  .final-score-row:last-child { border-bottom:none; }
  .rank-badge {
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:0.85rem;
  }
  .rank-1 { background:linear-gradient(135deg,#fbbf24,#f59e0b); color:#000; }
  .rank-2 { background:linear-gradient(135deg,#9ca3af,#6b7280); color:#fff; }
  .rank-3 { background:linear-gradient(135deg,#92400e,#b45309); color:#fff; }
  .rank-other { background:rgba(255,255,255,0.1); color:#9ca3af; }

  /* ── NOTIFICATION ── */
  .notification {
    position:fixed; top:1.5rem; right:1.5rem; z-index:400;
    padding:0.9rem 1.4rem; border-radius:14px; font-weight:600;
    font-size:0.95rem; max-width:300px;
    animation:notifIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
  }
  @keyframes notifIn {
    from { transform:translateX(100px); opacity:0; }
    to   { transform:translateX(0); opacity:1; }
  }
  .notif-success { background:linear-gradient(135deg,#065f46,#059669); border:1px solid #34d399; }
  .notif-info    { background:linear-gradient(135deg,#1e3a5f,#2563eb); border:1px solid #60a5fa; }
  .notif-warning { background:linear-gradient(135deg,#78350f,#d97706); border:1px solid #fbbf24; }

  /* ── RESPONSIVE ── */
  @media(max-width:900px) {
    #board { grid-template-columns:repeat(8,1fr); gap:4px; }
  }
  @media(max-width:600px) {
    #board { grid-template-columns:repeat(5,1fr); gap:4px; }
    .card-back::before { font-size:0.8em; }
  }
  @media(max-width:380px) {
    #board { grid-template-columns:repeat(4,1fr); gap:3px; }
  }

  /* ── WAITING OVERLAY ── */
  .waiting-overlay {
    position:absolute; inset:0; z-index:50;
    background:rgba(10,10,26,0.85); border-radius:14px;
    display:none; align-items:center; justify-content:center;
    font-size:2rem; backdrop-filter:blur(4px);
  }
  .waiting-overlay.active { display:flex; }

  /* ── RIPPLE ── */
  .ripple {
    position:absolute; border-radius:50%;
    background:rgba(167,139,250,0.4);
    transform:scale(0);
    animation:rippleOut 0.6s linear;
    pointer-events:none;
  }
  @keyframes rippleOut {
    to { transform:scale(4); opacity:0; }
  }
</style>
</head>
<body>

<!-- Floating particles background -->
<div id="particles"></div>

<!-- ═══════════════════ LOBBY ═══════════════════ -->
<div id="lobbyScreen" class="screen">
  <div class="game-title">🍎 Meyve Memory</div>
  <p class="game-subtitle">Çok Oyunculu Kart Eşleştirme</p>

  <div class="lobby-card">
    <div class="input-group">
      <label>Oyuncu Adın</label>
      <input type="text" id="playerName" placeholder="Adını gir..." maxlength="16" autocomplete="off">
    </div>
    <button class="btn btn-primary" onclick="joinLobby()">🚪 Lobiye Katıl</button>

    <div class="players-list" id="playersList" style="display:none">
      <h3>Bekleyen Oyuncular (<span id="playerCount">0</span>/12)</h3>
      <div id="playersChips"></div>
      <button class="btn btn-start" id="startBtn" onclick="startGame()" disabled>
        ▶ Oyunu Başlat (En Az 2 Oyuncu)
      </button>
    </div>

    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- ═══════════════════ GAME ═══════════════════ -->
<div id="gameScreen" class="screen" style="display:none; flex-direction:column; align-items:center;">

  <div class="game-header">
    <span class="header-title">🍎 Meyve Memory</span>
    <div class="turn-indicator" id="turnIndicator">⏳ Yükleniyor...</div>
    <span id="matchCount" style="color:#a78bfa; font-size:0.9rem;"></span>
  </div>

  <div class="scoreboard" id="scoreboard"></div>

  <div class="board-container">
    <div id="board"></div>
  </div>
</div>

<!-- ═══════════════════ GAME OVER ═══════════════════ -->
<div id="gameOverScreen">
  <div class="gameover-card">
    <span class="winner-crown">🏆</span>
    <div class="winner-title">Oyun Bitti! Kazanan:</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="final-scores" id="finalScores"></div>
    <button class="btn btn-start" onclick="playAgain()" style="width:100%">
      🔄 Tekrar Oyna
    </button>
  </div>
</div>

<script>
// ══════════════════════════════════════
//  AUDIO ENGINE (Web Audio API)
// ══════════════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;

function getCtx() {
  if (!ctx) ctx = new AudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function playTone(freq, type='sine', duration=0.15, vol=0.3, delay=0) {
  try {
    const c = getCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.connect(gain); gain.connect(c.destination);
    osc.type = type; osc.frequency.value = freq;
    const t = c.currentTime + delay;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
    osc.start(t); osc.stop(t+duration+0.05);
  } catch(e){}
}

function playFlipSound() {
  playTone(440,'sine',0.08,0.15);
  playTone(660,'sine',0.06,0.1,0.04);
}

function playMatchSound() {
  [523,659,784,1047].forEach((f,i) => playTone(f,'triangle',0.25,0.4,i*0.08));
}

function playMismatchSound() {
  playTone(180,'sawtooth',0.2,0.3);
  playTone(140,'sawtooth',0.18,0.2,0.1);
}

function playWinSound() {
  const melody = [523,659,784,880,1047,880,1047];
  melody.forEach((f,i) => playTone(f,'triangle',0.3,0.5,i*0.12));
}

function playClickSound() {
  playTone(800,'square',0.04,0.1);
}

// ══════════════════════════════════════
//  PARTICLES
// ══════════════════════════════════════
function createParticles() {
  const container = document.getElementById('particles');
  const colors = ['#a78bfa','#fbbf24','#34d399','#f87171','#60a5fa'];
  for(let i=0;i<35;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.cssText=`
      left:${Math.random()*100}%;
      width:${2+Math.random()*4}px;
      height:${2+Math.random()*4}px;
      background:${colors[i%colors.length]};
      animation-duration:${5+Math.random()*10}s;
      animation-delay:${Math.random()*8}s;
    `;
    container.appendChild(p);
  }
}
createParticles();

// ══════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════
function launchConfetti(x, y, count=20) {
  const colors=['#fbbf24','#a78bfa','#34d399','#f87171','#60a5fa','#fff'];
  for(let i=0;i<count;i++){
    const c=document.createElement('div');
    c.className='confetti-piece';
    c.style.cssText=`
      left:${x+(Math.random()-0.5)*200}px;
      top:${y}px;
      background:${colors[i%colors.length]};
      border-radius:${Math.random()>0.5?'50%':'2px'};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      animation-duration:${1+Math.random()}s;
      animation-delay:${Math.random()*0.3}s;
    `;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2000);
  }
}

function launchFullConfetti() {
  for(let i=0;i<8;i++){
    setTimeout(()=>{
      launchConfetti(window.innerWidth*Math.random(), 0, 25);
    }, i*150);
  }
}

// ══════════════════════════════════════
//  POPUP
// ══════════════════════════════════════
function showCombo(text, emoji='') {
  const el=document.createElement('div');
  el.className='combo-popup';
  el.innerHTML=`${emoji}<br>${text}`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}

function showNotification(msg, type='info', duration=2500) {
  const el=document.createElement('div');
  el.className=`notification notif-${type}`;
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{
    el.style.animation='notifIn 0.3s reverse';
    setTimeout(()=>el.remove(),300);
  },duration);
}

// ══════════════════════════════════════
//  SOCKET
// ══════════════════════════════════════
const socket = io();
let myId = null;
let isHost = false;
let gameBoard = [];
let matchedCount = 0;
let currentPlayerId = null;

socket.on('welcome', ({id, gameStarted}) => {
  myId = id;
});

socket.on('error', ({message}) => {
  const errEl = document.getElementById('errorMsg');
  errEl.textContent = message;
  errEl.style.display='block';
  setTimeout(()=>errEl.style.display='none', 3000);
  showNotification('⚠ '+message,'warning');
});

socket.on('lobbyUpdate', ({players, maxPlayers, gameStarted}) => {
  const list = document.getElementById('playersList');
  const chips = document.getElementById('playersChips');
  const startBtn = document.getElementById('startBtn');
  const countEl = document.getElementById('playerCount');
  list.style.display='block';
  countEl.textContent=players.length;
  chips.innerHTML='';
  players.forEach(p=>{
    const chip=document.createElement('div');
    chip.className='player-chip';
    chip.style.cssText=`background:${p.color+'22'};border-color:${p.color+'66'};color:${p.color}`;
    chip.innerHTML=`${p.avatar||'🎮'} ${p.name}`;
    chips.appendChild(chip);
  });
  // host = first player
  if(players.length>0 && players[0].id===myId) {
    isHost=true;
    startBtn.disabled = players.length<2;
    startBtn.style.display='block';
  } else {
    isHost=false;
    startBtn.style.display = players.length>0 ? 'block':'none';
    startBtn.disabled=true;
    startBtn.textContent='⏳ Host Oyunu Başlatacak...';
  }
});

socket.on('gameStarted', ({board, playerOrder, currentPlayer, scoreboard}) => {
  gameBoard = board;
  currentPlayerId = currentPlayer;
  matchedCount = 0;
  document.getElementById('lobbyScreen').style.display='none';
  const gs=document.getElementById('gameScreen');
  gs.style.display='flex';
  renderBoard(board);
  updateScoreboard(scoreboard, playerOrder, currentPlayer);
  updateTurnIndicator(currentPlayer, scoreboard);
  updateMatchCount();
  showNotification('🎮 Oyun başladı! İyi eğlenceler!','success');
  playTone(523,'triangle',0.5,0.4);
});

socket.on('gameState', ({board, currentPlayer, scoreboard, playerOrder, locked}) => {
  gameBoard = board;
  currentPlayerId = currentPlayer;
  updateScoreboard(scoreboard, playerOrder, currentPlayer);
  updateTurnIndicator(currentPlayer, scoreboard);
  updateBoardState(board, locked);
  updateMatchCount();
});

socket.on('cardFlipped', ({cardId, fruit, playerId}) => {
  const cardEl=document.querySelector(`.card[data-id="${cardId}"]`);
  if(!cardEl) return;
  cardEl.classList.add('flipped');
  cardEl.querySelector('.card-front').textContent=fruit;
  if(playerId!==myId) playFlipSound();
});

socket.on('cardsMatched', ({cardIds, playerId, playerName, scoreboard}) => {
  cardIds.forEach(id=>{
    const el=document.querySelector(`.card[data-id="${id}"]`);
    if(!el) return;
    el.classList.add('matched');
    el.classList.remove('wrong');
    el.style.pointerEvents='none';
    const rect=el.getBoundingClientRect();
    launchConfetti(rect.left+rect.width/2, rect.top, 12);
  });
  matchedCount++;
  updateMatchCount();
  playMatchSound();

  if(playerId===myId){
    showCombo('+10 PUAN!','🎉');
  } else {
    showNotification(`${playerName} eşleştirdi! +10 🎯`,'success',2000);
  }
  updateScoreboardHighlight(scoreboard);
});

socket.on('cardsMismatched', ({cardIds, nextPlayer}) => {
  cardIds.forEach(id=>{
    const el=document.querySelector(`.card[data-id="${id}"]`);
    if(!el) return;
    el.classList.add('wrong');
    setTimeout(()=>{
      el.classList.remove('flipped','wrong');
      el.querySelector('.card-front').textContent='';
    },1100);
  });
  currentPlayerId=nextPlayer;
  playMismatchSound();
  if(nextPlayer===myId){
    setTimeout(()=>showNotification('🎯 Senin sıran!','info',2000),800);
  }
});

socket.on('gameOver', ({scoreboard, winner}) => {
  playWinSound();
  launchFullConfetti();
  document.getElementById('winnerName').textContent=`${winner.avatar||'🏆'} ${winner.name} — ${winner.score} puan`;
  const fs=document.getElementById('finalScores');
  fs.innerHTML=scoreboard.map((p,i)=>`
    <div class="final-score-row">
      <div class="rank-badge rank-${i<3?i+1:'other'}">${i+1}</div>
      <span style="font-size:1.3rem">${p.avatar||'🎮'}</span>
      <span style="flex:1;font-weight:600;color:${p.color||'#fff'}">${p.name}</span>
      <span style="color:var(--gold);font-weight:800">${p.score} pts</span>
    </div>
  `).join('');
  document.getElementById('gameOverScreen').style.display='flex';
  showCombo('OYUN BİTTİ!','🏆');
});

socket.on('returnToLobby', () => {
  document.getElementById('gameScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  document.getElementById('lobbyScreen').style.display='flex';
  document.getElementById('playersList').style.display='none';
  showNotification('🏠 Lobiye dönüldü!','info');
});

// ══════════════════════════════════════
//  LOBBY FUNCTIONS
// ══════════════════════════════════════
function joinLobby() {
  playClickSound();
  const name = document.getElementById('playerName').value.trim();
  if(!name) {
    showNotification('Lütfen bir isim gir!','warning');
    return;
  }
  socket.emit('joinLobby', {name});
}

function startGame() {
  playClickSound();
  socket.emit('startGame');
}

function playAgain() {
  playClickSound();
  socket.emit('playAgain');
}

document.getElementById('playerName').addEventListener('keydown', e=>{
  if(e.key==='Enter') joinLobby();
});

// ══════════════════════════════════════
//  BOARD RENDERING
// ══════════════════════════════════════
function renderBoard(board) {
  const boardEl=document.getElementById('board');
  boardEl.innerHTML='';
  board.forEach(card=>{
    const el=document.createElement('div');
    el.className='card'+(card.matched?' flipped matched':'');
    el.dataset.id=card.id;
    el.innerHTML=`
      <div class="card-inner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">${card.matched?card.fruit:''}</div>
      </div>
    `;
    el.addEventListener('click', ()=>onCardClick(el, card.id));
    if(card.matched) el.style.pointerEvents='none';
    boardEl.appendChild(el);
  });
}

function updateBoardState(board, locked) {
  board.forEach(card=>{
    const el=document.querySelector(`.card[data-id="${card.id}"]`);
    if(!el) return;
    if(card.matched){
      el.classList.add('matched','flipped');
      el.querySelector('.card-front').textContent=card.fruit;
      el.style.pointerEvents='none';
    }
    if(locked || currentPlayerId!==myId){
      el.classList.add('locked');
    } else {
      if(!card.matched && !card.flipped) el.classList.remove('locked');
    }
  });
}

function onCardClick(el, cardId) {
  playClickSound();
  if(currentPlayerId !== myId) {
    showNotification('⏳ Senin sıran değil!','warning',1500);
    return;
  }
  if(el.classList.contains('flipped')||el.classList.contains('matched')) return;

  // Ripple
  const rect=el.getBoundingClientRect();
  const r=document.createElement('div');
  r.className='ripple';
  r.style.cssText=`width:${rect.width}px;height:${rect.height}px;left:0;top:0;`;
  el.appendChild(r);
  setTimeout(()=>r.remove(),700);

  el.classList.add('flipped');
  playFlipSound();
  socket.emit('flipCard', {cardId});
}

function updateMatchCount() {
  const total=20;
  const matched=document.querySelectorAll('.card.matched').length;
  const pairs=Math.floor(matched/2);
  document.getElementById('matchCount').textContent=`🃏 ${pairs}/${total} çift`;
}

// ══════════════════════════════════════
//  SCOREBOARD
// ══════════════════════════════════════
function updateScoreboard(scoreboard, playerOrder, currentPlayer) {
  const el=document.getElementById('scoreboard');
  el.innerHTML=scoreboard.map(p=>`
    <div class="score-item${p.id===currentPlayer?' active':''}">
      <span class="s-avatar">${p.avatar||'🎮'}</span>
      <span class="s-name" style="color:${p.color||'#fff'}">${p.name}${p.id===myId?' (Sen)':''}</span>
      <span class="s-score">${p.score}</span>
    </div>
  `).join('');
}

function updateScoreboardHighlight(scoreboard) {
  scoreboard.forEach(p=>{
    const items=document.querySelectorAll('.score-item');
    items.forEach(item=>{
      const name=item.querySelector('.s-name').textContent.replace(' (Sen)','');
      if(name===p.name){
        item.querySelector('.s-score').textContent=p.score;
        item.style.animation='none';
        item.offsetHeight;
        item.style.animation='chipIn 0.4s cubic-bezier(0.34,1.56,0.64,1)';
      }
    });
  });
}

function updateTurnIndicator(currentPlayer, scoreboard) {
  const el=document.getElementById('turnIndicator');
  const player=scoreboard?.find(p=>p.id===currentPlayer);
  if(!player){ el.textContent='⏳ Bekleniyor...'; return; }
  const isMe=currentPlayer===myId;
  el.className='turn-indicator'+(isMe?' my-turn':'');
  el.innerHTML=isMe
    ? `<span style="animation:pulse 0.5s infinite">✨</span> Senin Sıran!`
    : `${player.avatar||'🎮'} ${player.name}'in Sırası`;
}
</script>
